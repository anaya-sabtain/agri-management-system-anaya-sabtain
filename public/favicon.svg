<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="agriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2bb673" />
      <stop offset="100%" stop-color="#52c486" />
    </linearGradient>
    <linearGradient id="grainGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Emblem Base -->
  <rect width="64" height="64" rx="16" fill="url(#agriGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#52c486" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Agricultural Wheat & Sprout Motif (Matches AgriSense brand) -->
  <g filter="url(#subtleShadow)">
    <!-- Central Stalk / Stem -->
    <path d="M18 50 C26 44 34 32 46 16" stroke="#e0efe2" stroke-width="3" stroke-linecap="round" />

    <!-- Top Sprout / Crown Grain -->
    <path d="M46 16 C48 11 51 9 52 9 C52 10 50 13 46 16 Z" fill="url(#grainGrad)" />
    <path d="M41 13 C45 11 48 12 50 14 C48 16 44 16 41 13 Z" fill="url(#grainGrad)" />

    <!-- Right Side Wheat Grains / Leaves -->
    <!-- Top-Right -->
    <path d="M42 21 C48 19 51 22 51 25 C47 27 43 25 42 21 Z" fill="url(#leafGrad)" />
    <!-- Mid-Right -->
    <path d="M35 29 C42 27 45 31 44 34 C40 35 36 33 35 29 Z" fill="url(#leafGrad)" />
    <!-- Lower-Right -->
    <path d="M28 37 C35 36 38 40 37 43 C33 44 29 41 28 37 Z" fill="url(#leafGrad)" />

    <!-- Left Side Wheat Grains / Leaves -->
    <!-- Top-Left -->
    <path d="M36 17 C34 11 30 11 27 13 C29 18 33 18 36 17 Z" fill="url(#grainGrad)" />
    <!-- Mid-Left -->
    <path d="M30 25 C26 20 22 21 20 24 C23 28 27 27 30 25 Z" fill="url(#grainGrad)" />
    <!-- Lower-Left -->
    <path d="M24 33 C19 29 15 31 14 34 C18 37 22 35 24 33 Z" fill="url(#grainGrad)" />

    <!-- Base Root Arc Accent -->
    <circle cx="16" cy="52" r="2.5" fill="#52c486" />
  </g>
</svg>